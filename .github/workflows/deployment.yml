name: Deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]"
      - name: Verify independent HTTPS ingress with actual nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx certbot
          python -m pytest -q tests/integration/test_waw_web_ingress.py tests/integration/test_waw_certbot_cli.py
      - run: >-
          pytest
          tests/unit/test_installer_platform.py
          tests/unit/test_installer_artifact.py
          tests/unit/test_installer_build.py
          tests/unit/test_installer_backup.py
          tests/unit/test_database_security.py
          tests/unit/test_installer_host.py
          tests/unit/test_installer_lifecycle.py
          tests/unit/test_installer_staged_recovery.py
          tests/unit/test_helper_protocol.py
          tests/unit/test_deployment_assets.py
          tests/unit/test_privilege_isolation.py
          tests/integration/test_static_web.py
      - name: Verify actual native-helper build, retry and Runtime-owned epoch bootstrap
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11' }}
        run: |
          native_fixture_dir="$(mktemp -d "$RUNNER_TEMP/agentbox-native-root.XXXXXX")"
          sudo env AGENTBOX_ENV=test PYTHONDONTWRITEBYTECODE=1 \
            AGENTBOX_DATA_DIR="$native_fixture_dir/data" \
            AGENTBOX_TOML_FILE="$native_fixture_dir/config.toml" \
            AGENTBOX_DATABASE_URL=sqlite+pysqlite:///:memory: \
            "$(command -v python)" -m pytest -q -p no:cacheprovider \
            --basetemp "$native_fixture_dir/pytest" \
            tests/unit/test_installer_waw_native.py -k linux
      - name: Prove independent HTTPS unit DynamicUser and TLS credentials
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11' }}
        run: |
          sudo env GITHUB_ACTIONS=true AGENTBOX_ENV=test \
            "$(command -v python)" -m pytest -q -s -p no:cacheprovider \
            tests/integration/test_waw_web_systemd.py
      - name: Verify actual pinned native vendors without login
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11' }}
        env:
          AGENTBOX_VENDOR_DISTRIBUTION_PROBE: "1"
        run: python -m pytest -q -s tests/integration/test_waw_vendor_distribution.py
      - name: Prove systemd 255 scoped cgroup delegation with native PID 1
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11' }}
        run: sudo env GITHUB_ACTIONS=true /usr/bin/python3 scripts/probe-waw-delegation.py
      - name: Exercise actual Runtime cgroup creation helpers under native PID 1
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11' }}
        run: sudo env GITHUB_ACTIONS=true "$(command -v python)" scripts/probe-waw-cgroup-setup.py
      - run: bash scripts/check-skeleton-boundaries.sh

  deployment-gate:
    name: deployment-gate
    needs: installer
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the complete installer matrix
        env:
          INSTALLER_RESULT: ${{ needs.installer.result }}
        run: test "$INSTALLER_RESULT" = "success"
