name: Deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]"
      - run: >-
          pytest
          tests/unit/test_installer_platform.py
          tests/unit/test_installer_artifact.py
          tests/unit/test_installer_build.py
          tests/unit/test_installer_backup.py
          tests/unit/test_database_security.py
          tests/unit/test_installer_host.py
          tests/unit/test_installer_lifecycle.py
          tests/unit/test_helper_protocol.py
          tests/unit/test_deployment_assets.py
          tests/unit/test_privilege_isolation.py
          tests/integration/test_static_web.py
      - run: bash scripts/check-skeleton-boundaries.sh

  deployment-gate:
    name: deployment-gate
    needs: installer
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the complete installer matrix
        env:
          INSTALLER_RESULT: ${{ needs.installer.result }}
        run: test "$INSTALLER_RESULT" = "success"
