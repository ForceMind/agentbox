name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]"
      - run: pnpm install --frozen-lockfile
      - run: python -m pytest -q tests/unit/test_e2e_auth_timing.py
      - name: Install Chinese glyphs for actual rendering evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libnss3-tools
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-cn' | grep --fixed-strings 'Noto Sans CJK'
      - run: pnpm --filter @agentbox/web exec playwright install chromium
      - run: pnpm e2e
      - name: Retain synthetic A3 Changes screenshots
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a3-changes-rendering
          path: |
            apps/web/test-results/a3-changes-*.png
            apps/web/test-results/a3-native-changes-*.png
            apps/web/test-results/work-overview-*.png
            apps/web/test-results/ui-shell-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain isolated synthetic shell screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-shell-failure-rendering
          path: apps/web/test-results/ui-shell-*.png
          if-no-files-found: warn
          retention-days: 7
