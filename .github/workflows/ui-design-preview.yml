name: UI Design Preview
on:
  push:
    branches: [design/agentbox-ui-study-20261005]
    paths:
      - design/ui-refresh/**
      - .github/workflows/ui-design-preview.yml
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and Chinese glyphs
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pnpm --filter @agentbox/web exec playwright install --with-deps chromium
      - name: Verify isolated prototype and capture actual pixels
        run: node design/ui-refresh/verify.mjs
      - name: Retain synthetic design preview and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentbox-ui-design-preview
          path: |
            design/ui-refresh/index.html
            design/ui-refresh/README.md
            design/ui-refresh/DESIGN.md
            design/ui-refresh/verification.json
            design/ui-refresh/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
