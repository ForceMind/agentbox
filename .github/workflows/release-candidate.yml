name: Release Candidate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packaging-toolchain:
    name: packaging-toolchain (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-release-packaging.lock
      - name: Install fixed packaging tools from the reviewed lock
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --no-deps
          --requirement requirements-release-packaging.lock
      - name: Verify fixed packaging tools
        run: >-
          PYTHONPATH=installer/src
          python scripts/check-release-toolchain.py
          --source .
          --check-packaging-installed

  release-candidate:
    name: release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AGENTBOX_EXPECTED_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      AGENTBOX_SOURCE_REF_KIND: ${{ github.event_name == 'pull_request' && 'pull_request_head' || 'main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-release-build.lock
            requirements-release-bootstrap.lock
            requirements-release-packaging.lock
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: pnpm
      - name: Install reviewed build tools
        run: |
          test "$(git rev-parse HEAD)" = "$AGENTBOX_EXPECTED_SOURCE_COMMIT"
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-release-build.lock
          python -m pip install --no-deps --no-build-isolation --editable .
          pnpm install --frozen-lockfile
          python scripts/check-release-toolchain.py --source . --check-installed
          python -m pip_audit --local --skip-editable
      - name: Build deterministic frontend
        run: pnpm build
      - name: Verify version and documentation
        run: |
          agentbox-install verify-version --source .
          python scripts/check-doc-links.py
          pnpm licenses list --prod --json | python scripts/check-frontend-licenses.py --source .
      - name: Read verified release version
        id: release-version
        run: |
          version="$(agentbox-install verify-version --source .)"
          test -n "$version"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build candidate twice
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          agentbox-install build-release-candidate --source . --output-dir "$RUNNER_TEMP/agentbox-rc-a" --source-ref-kind "$AGENTBOX_SOURCE_REF_KIND"
          agentbox-install build-release-candidate --source . --output-dir "$RUNNER_TEMP/agentbox-rc-b" --source-ref-kind "$AGENTBOX_SOURCE_REF_KIND"
      - name: Require byte-for-byte reproducibility
        run: |
          diff -r "$RUNNER_TEMP/agentbox-rc-a" "$RUNNER_TEMP/agentbox-rc-b"
          test "$(sha256sum "$RUNNER_TEMP"/agentbox-rc-a/agentbox-*.tar.gz | cut -d' ' -f1)" = "$(sha256sum "$RUNNER_TEMP"/agentbox-rc-b/agentbox-*.tar.gz | cut -d' ' -f1)"
      - name: Verify manifest, checksums, SBOM, archive, and secrets
        run: |
          artifact="$(find "$RUNNER_TEMP/agentbox-rc-a" -maxdepth 1 -name 'agentbox-*.tar.gz' -print -quit)"
          agentbox-install verify-artifact \
            --artifact "$artifact" \
            --checksums "$RUNNER_TEMP/agentbox-rc-a/SHA256SUMS" \
            --manifest "$RUNNER_TEMP/agentbox-rc-a/RELEASE_MANIFEST.json" \
            --sbom "$RUNNER_TEMP/agentbox-rc-a/SBOM.spdx.json"
          python scripts/check-release-artifact.py \
            --artifact "$artifact" \
            --checksums "$RUNNER_TEMP/agentbox-rc-a/SHA256SUMS" \
            --manifest "$RUNNER_TEMP/agentbox-rc-a/RELEASE_MANIFEST.json" \
            --sbom "$RUNNER_TEMP/agentbox-rc-a/SBOM.spdx.json" \
            --expected-source-commit "$AGENTBOX_EXPECTED_SOURCE_COMMIT" \
            --expected-source-ref-kind "$AGENTBOX_SOURCE_REF_KIND"
          python scripts/check-release-inventory.py \
            --source . \
            --artifact "$artifact"
      - name: Artifact-only install and recovery smoke
        run: |
          artifact="$(find "$RUNNER_TEMP/agentbox-rc-a" -maxdepth 1 -name 'agentbox-*.tar.gz' -print -quit)"
          python scripts/release-smoke.py \
            --artifact "$artifact" \
            --checksums "$RUNNER_TEMP/agentbox-rc-a/SHA256SUMS" \
            --manifest "$RUNNER_TEMP/agentbox-rc-a/RELEASE_MANIFEST.json" \
            --sbom "$RUNNER_TEMP/agentbox-rc-a/SBOM.spdx.json"
          pytest \
            tests/unit/test_installer_backup.py \
            tests/unit/test_installer_lifecycle.py \
            tests/unit/test_installer_retention.py \
            tests/unit/test_release_candidate.py \
            tests/unit/test_release_install_script.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentbox-${{ steps.release-version.outputs.value }}-linux-x86_64
          path: ${{ runner.temp }}/agentbox-rc-a/
          if-no-files-found: error
          retention-days: 7

  release-gate:
    name: release-gate
    needs: [packaging-toolchain, release-candidate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every release-candidate verification
        env:
          PACKAGING_TOOLCHAIN_RESULT: ${{ needs.packaging-toolchain.result }}
          RELEASE_CANDIDATE_RESULT: ${{ needs.release-candidate.result }}
        run: |
          test "$PACKAGING_TOOLCHAIN_RESULT" = "success"
          test "$RELEASE_CANDIDATE_RESULT" = "success"
