repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: black
        name: black
        entry: black --check
        language: system
        types: [python]
      - id: repository-secrets
        name: repository secret patterns
        entry: bash scripts/check-secrets.sh
        language: system
        pass_filenames: false
      - id: source-boundaries
        name: AgentBox source boundaries
        entry: bash scripts/check-skeleton-boundaries.sh
        language: system
        pass_filenames: false
