const statePanel=()=>{if(state==='ready')return '';if(state==='loading')return `<div class="panel pad" role="status"><h2>正在读取最新状态</h2><p class="subtitle">不会显示上次的行、数量或操作许可</p>${[86,63,74].map(w=>`<div class="skeleton" style="width:${w}%"></div>`).join('')}</div>`;if(state==='empty')return `<div class="panel empty">${i('folder')}<h2>从第一个项目开始</h2><p>把工作收进一个正式项目，再选择合适的 Agent。这里会出现需要你处理的事项和最近的项目</p>${btn('添加项目','new-project','primary','plus')}</div>`;const info={error:['这一部分暂时没有读到','已有内容已清除，不能把读取失败当作没有工作。你可以稍后重新读取。'],permission:['当前账号不能查看这部分内容','没有展示旧数据或数量。请确认登录身份与项目权限。'],stale:['连接中断，状态需要重新确认','已清除上次的内容与操作权限。重新读取不会自动启动、连接或继续 Agent。']}[state];return `<div class="panel empty">${i(state==='permission'?'shield':'alert')}<h2>${info[0]}</h2><p>${info[1]}</p>${btn('重新读取示例','refresh','primary','refresh')}</div>`};

function projectCards(){return `<div class="project-grid">${projects.map(p=>`<a class="panel project-card" href="#project" data-project-name="${p[1]}"><div class="project-avatar ${p[3]}">${p[0]}</div><div class="spread project-card-top"><h3>${p[1]}</h3>${i('chevron')}</div><p class="description">${p[2]}</p><div class="meta"><span>${p[4]}</span><span>更新于 ${p[5]}</span></div></a>`).join('')}</div>`}
function overview(){return `${head('YOUR WORK, IN FOCUS','工作概览','先看需要你处理的，再回到手上的事',btn('打开项目','go-projects','','folder'))}${state!=='ready'?statePanel():`<div class="hero-grid"><section class="panel"><div class="panel-head"><h2>需要你处理 <span class="muted small">02</span></h2><a href="#attention" class="text-link">查看全部 ${i('arrow')}</a></div><div class="attention-list"><a class="attention-row" href="#attention"><span class="icon-tile">${i('alert')}</span><div><h3>项目克隆需要检查</h3><p>Notes Lab · 后台操作中断，结果尚未确认</p></div>${i('chevron')}</a><a class="attention-row" href="#system"><span class="icon-tile">${i('shield')}</span><div><h3>工作台还需要完成连接检查</h3><p>AgentBox · 打开前确认受信浏览器与 Runtime</p></div>${i('chevron')}</a></div><div class="section-note">示例事项 · 待处理数量来自有界记录，不代表全部任务</div></section><section class="focus-panel"><div class="eyebrow">PICK UP WHERE YOU LEFT OFF</div><h2>一个项目，<br>一处工作现场</h2><p>回到项目，再决定查看变化<br>或打开 Agent 工作台</p><a href="#project" class="btn">打开 AgentBox ${i('arrow')}</a><div class="focus-graphic">${i('box')}</div></section></div><div class="section-head"><h2>进行中的后台操作</h2><span class="small">最近 100 条中的示例</span></div><div class="work-list"><a class="work-row" href="#attention"><span class="agent-icon">${i('branch')}</span><div><strong>读取远端分支</strong><p>AgentBox · Git 操作</p></div><span class="secondary">主工作副本</span>${badge('正在运行','blue')}${i('chevron')}</a><a class="work-row" href="#attention"><span class="agent-icon">${i('folder')}</span><div><strong>准备项目目录</strong><p>Design System · 项目操作</p></div><span class="secondary">正式项目</span>${badge('排队中')}${i('chevron')}</a></div><div class="section-head"><h2>最近更新的项目</h2><a href="#projects" class="text-link">所有项目 ${i('arrow')}</a></div>${projectCards()}<p class="footnote">项目时间表示元数据更新，不表示最近访问。连接、执行状态与 Agent 的工作进度分别呈现</p>`}${notes()}`}

function settings(){return `${head('MAKE ROOM FOR YOUR WORK','设置','日常偏好在这里，技术细节放在需要时') }<div class="two-col"><div><section class="panel pad"><h2>外观与使用</h2><div class="settings-list"><div class="setting"><div><h3>界面外观</h3><p>暖白日间与墨色夜间，共用同一套层次</p></div>${btn(theme==='dark'?'切换浅色':'切换深色','theme','',theme==='dark'?'sun':'moon')}</div><div class="setting"><div><h3>界面语言</h3><p>正式产品遵循首选浏览器语言；本稿为中文</p></div>${badge('简体中文')}</div><div class="setting"><div><h3>快捷打开</h3><p>搜索项目或跳转页面</p></div>${btn('⌘ K','search')}</div></div></section><section class="panel pad" style="margin-top:20px"><h2>账号与连接</h2><div class="settings-list"><div class="setting"><div><h3>当前工作站</h3><p>单台 AgentBox 部署 · 设计示例</p></div><a class="btn" href="#system">查看状态</a></div><div class="setting"><div><h3>浏览器信任</h3><p>工作台连接前单独验证，不由登录替代</p></div>${badge('需要验证','amber')}</div><div class="setting"><div><h3>模型与服务提供方</h3><p>Provider Manager 尚待独立合同与实现</p></div>${badge('规划样本')}</div></div></section></div><aside><div class="panel pad"><h2>开始与帮助</h2><a class="nav-item" href="#onboarding">${i('box')} 首次使用引导 ${i('arrow')}</a><a class="nav-item" href="#system">${i('activity')} 系统诊断 ${i('arrow')}</a><a class="nav-item" href="#map">${i('layers')} 设计页面索引 ${i('arrow')}</a><p class="footnote">本原型不保存账号、凭据、消息或项目内容。外观选择仅在当前页面内存中生效</p></div></aside></div>${notes()}`}
function system(){return `${head('UNDER THE SURFACE','系统状态','技术信息集中在这里，不占据日常首页',btn('重新检查示例','refresh','','refresh'))}<div class="state-banner"><div><strong>工作台尚未准入</strong><br>这份原型没有连接真实主机。控制面就绪不能替代 Agent 工作台准入</div>${badge('设计样本','outline')}</div><div class="panel pad"><h2>连接条件</h2><div class="settings-list">${[['控制面服务','登录与项目管理所需的服务','未检测'],['Runtime','固定操作与进程所有权','未检测'],['CLI 与登录','Claude Code / Codex 独立检查','未确认'],['受信浏览器','浏览器身份、通道与项目作用域','待验证'],['真实主机验收','隔离、重连、停止与恢复证据','未运行']].map(x=>`<div class="setting"><div><h3>${x[0]}</h3><p>${x[1]}</p></div>${badge(x[2])}</div>`).join('')}</div></div><details class="panel pad" style="margin-top:20px"><summary>高级诊断</summary><p class="small" style="margin-top:16px;line-height:1.9">展示固定错误码、受支持版本与只读检查结果。未知状态保持未知，不降级为任意终端或文件系统访问</p><p class="mono" style="margin-top:12px">WORKSPACE_NOT_ADMITTED<br>NO_REAL_HOST_CONNECTION</p></details>${notes()}`}
function onboarding(){const content=[`<h2>先选择一个正式项目</h2><p class="subtitle">把 Agent 的工作限定在清楚的项目范围内</p><div class="grid-2" style="margin-top:25px"><button class="mode-option selected" data-action="mode-select">${i('folder')}<h3>创建项目</h3><p>由工作站准备受管目录</p></button><button class="mode-option" data-action="mode-select">${i('branch')}<h3>从 GitHub 克隆</h3><p>使用受支持的仓库流程</p></button></div><div class="form-group"><label for="project-name">项目名称</label><input id="project-name" class="input" placeholder="例如：我的第一个项目" maxlength="120"><p>项目名称用于识别，不是服务器上的可执行路径</p></div>`,`<h2>选择要使用的 Agent</h2><p class="subtitle">安装、登录与工作台准入会分别检查</p><div class="grid-2" style="margin-top:25px"><button class="mode-option selected" data-action="mode-select"><h3>✳ Claude Code</h3><p>受控 CLI 工作区</p></button><button class="mode-option" data-action="mode-select"><h3>◈ Codex</h3><p>受控 CLI 工作区</p></button></div><div class="feature-note" style="margin-top:25px">这里不输入密码或 API Key。正式登录与受信设置通过各自的安全流程完成</div>`,`<h2>最后，确认使用条件</h2><p class="subtitle">知道还有哪些步骤，不把未检测当成已准备好</p><div class="settings-list"><div class="setting"><span>项目目录</span>${badge('未创建')}</div><div class="setting"><span>Agent 登录</span>${badge('未确认')}</div><div class="setting"><span>浏览器信任</span>${badge('待验证','amber')}</div><div class="setting"><span>真实主机资格</span>${badge('未运行')}</div></div><div class="feature-note" style="margin-top:20px">引导仅演示页面顺序。完成本稿不会创建项目、登录账号或开启工作台</div>`][onboardStep-1];return `<div class="onboarding">${head('A GOOD PLACE TO BEGIN','让第一个项目开始','三个步骤，把工作现场整理好')}<div class="onboard-grid"><aside class="steps">${['选择项目','选择 Agent','确认条件'].map((s,n)=>`<div class="step ${n+1===onboardStep?'active':''}"><span class="step-number">${n+1}</span><span class="step-text">${s}</span></div>`).join('')}</aside><section class="panel pad">${content}<div class="spread" style="margin-top:32px">${btn(onboardStep===1?'稍后再说':'上一步',onboardStep===1?'go-overview':'onboard-back')}${btn(onboardStep===3?'查看工作站':'下一步',onboardStep===3?'go-system':'onboard-next','primary','arrow')}</div></section></div>${notes()}</div>`}

document.addEventListener('click',e=>{const drawerLink=e.target.closest('.sidebar.open a');if(drawerLink){document.querySelector('.sidebar').classList.remove('open');document.querySelector('.drawer-backdrop').classList.remove('open');document.querySelector('.main').inert=false;document.querySelector('.mobile-nav').inert=false;if(drawerLink.hash===location.hash){e.preventDefault();document.querySelector('.mobile-menu').focus()}}const a=e.target.closest('[data-action]'),tab=e.target.closest('[data-inspect]');if(tab){inspect=tab.dataset.inspect;render();return}if(e.target.closest('[data-command]'))closeModal();if(!a)return;const action=a.dataset.action;if(action.startsWith('go-')){closeModal();location.hash=action.slice(3);return}switch(action){case 'theme':theme=theme==='light'?'dark':'light';render();break;case 'search':search();break;case 'menu':document.querySelector('.sidebar').classList.add('open');document.querySelector('.drawer-backdrop').classList.add('open');document.querySelector('.main').inert=true;document.querySelector('.mobile-nav').inert=true;document.querySelector('.sidebar a').focus();break;case 'close-menu':document.querySelector('.sidebar').classList.remove('open');document.querySelector('.drawer-backdrop').classList.remove('open');document.querySelector('.main').inert=false;document.querySelector('.mobile-nav').inert=false;document.querySelector('.mobile-menu').focus();break;case 'close-dialog':closeModal();break;case 'refresh':state='loading';render();clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{state='ready';render();showToast('已重新载入设计示例，未连接真实服务')},700);break;case 'new-project':modal('添加项目','<p class="muted">这是项目创建流程的设计演示。不会创建目录或发送真实请求。</p><div class="form-group"><label for="new-project-name">项目名称</label><input class="input" id="new-project-name" placeholder="给项目一个名字" maxlength="120"></div>',btn('取消','close-dialog')+btn('预览下一步','preview-create','primary'));break;case 'preview-create':if(!document.getElementById('new-project-name').value.trim()){document.getElementById('new-project-name').setAttribute('aria-invalid','true');showToast('先填写项目名称');return}closeModal();location.hash='onboarding';break;case 'labels':modal('项目标签','<p class="muted">标签是元数据，不授予运行或内容访问权限。</p><div class="flex wrap" style="margin-top:20px">'+badge('个人项目','blue')+badge('正在设计','amber')+badge('长期维护','green')+'</div>',btn('完成','close-dialog','primary'));break;case 'favorite':showToast('已演示收藏反馈，未保存到服务器');break;case 'filter-favorite':showToast('设计示例中 3 个项目均在收藏范围');break;case 'show-history':modal('已处理','<p>这里没有已处理的示例记录。</p><p class="muted">正式产品需要可信历史来源，不能仅凭点击把事项标成成功。</p>',btn('返回','close-dialog','primary'));break;case 'archive-view':modal('已归档项目 · 规划样本','<p>归档与物理删除分开。未保存、未推送的变化必须保留，不因为收起项目而停止 Agent 或删除工作副本。</p>',btn('知道了','close-dialog','primary'));break;case 'toggle-pane':mobilePane=mobilePane==='conversation'?'inspection':'conversation';render();break;case 'workspace-add':modal('新的工作上下文 · 规划样本','<p>多工作副本、多会话和并列面板属于完整规划。现有 WAW 记录仍按 Project + AgentType 管理，不能用新标签伪造一个新的运行会话。</p>',btn('取消','close-dialog')+btn('了解规划','go-map','primary'));break;case 'session-info':modal('当前工作上下文','<p>项目：AgentBox<br>Agent：Claude Code<br>执行状态：未确认<br>客户端连接：未连接</p><p class="muted" style="margin-top:15px">这是结构化会话设计样本。正式产品的连接与执行状态分别检查；关闭标签不停止进程。</p>',btn('关闭','close-dialog','primary'));break;case 'stop':modal('停止当前 Agent？','<p>正式产品会重新验证当前项目、运行代次与进程所有权，只停止明确归属的 Agent 范围。项目文件会保留。</p><div class="feature-note" style="margin-top:15px">原型没有运行中的真实进程。本次仅演示确认与取消。</div>',btn('取消','close-dialog')+btn('演示停止','stop-demo','danger'));break;case 'stop-demo':closeModal();state='stale';render();showToast('示例状态已失效，没有停止真实进程');break;case 'approve':case 'deny':modal(action==='approve'?'仅允许这次？':'拒绝这次请求？','<p>仅用于 AgentBox 项目当前示例请求。真实审批必须绑定 requestId、generation 和有效期，并在提交前再次验证。</p>',btn('返回检查','close-dialog')+btn(action==='approve'?'确认演示允许':'确认演示拒绝','approval-demo','primary'));break;case 'approval-demo':closeModal();showToast('已展示决策反馈，没有向 Agent 发送权限');break;case 'diff-format':{const raw=document.querySelector('.diff');if(raw.dataset.raw){raw.outerHTML=diffBlock().match(/<div class="diff"[\s\S]*?<div class="code-comment">/)[0].replace('<div class="code-comment">','');a.textContent='统一视图'}else{raw.dataset.raw='true';raw.innerHTML='<pre style="padding:0 20px;white-space:pre-wrap;overflow-wrap:anywhere">'+esc('diff --git a/src/WorkOverview.tsx b/src/WorkOverview.tsx\n--- a/src/WorkOverview.tsx\n+++ b/src/WorkOverview.tsx\n'+diffRows.map(r=>r[3]).join('\n'))+'</pre>';a.textContent='完整原文'}break}case 'wrap-code':document.querySelectorAll('.code').forEach(el=>{el.style.whiteSpace=el.style.whiteSpace==='pre'?'pre-wrap':'pre'});showToast('已切换代码换行方式');break;case 'diff-file':showToast('此评审样本只包含 WorkOverview.tsx 的完整示例');break;case 'preview-file':modal('只读文件预览 · 规划样本','<p>文件只能在正式 Project 的受限内容合同内读取。二进制、过大、敏感与未知编码文件有独立提示。</p><p class="mono" style="margin-top:15px">示例内容安全呈现为文本</p>',btn('关闭','close-dialog','primary'));break;case 'artifact-open':modal('工作概览 · 设计说明','<p><strong>1. 让需要决定的事先出现</strong><br>待处理事项清楚说明原因和下一步。</p><p style="margin-top:15px"><strong>2. 工作有独立的空间</strong><br>项目、对话、变化与产出保持上下文。</p><p style="margin-top:15px"><strong>3. 状态有真实的边界</strong><br>过期后清除，未知不冒充完成。</p><p class="small" style="margin-top:18px">规划产出样本 · 未生成或读取真实项目内容</p>',btn('关闭预览','close-dialog','primary'));break;case 'artifact-filter':document.querySelectorAll('.tabs .tab').forEach(el=>el.classList.remove('active'));a.classList.add('active');showToast('已切换产出筛选示意');break;case 'mode-select':a.parentElement.querySelectorAll('.mode-option').forEach(el=>el.classList.remove('selected'));a.classList.add('selected');break;case 'onboard-next':onboardStep=Math.min(3,onboardStep+1);render();break;case 'onboard-back':onboardStep=Math.max(1,onboardStep-1);render();break}});
document.getElementById('dialog').addEventListener('close',()=>{if(dialogOpener?.isConnected)dialogOpener.focus()});document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!document.getElementById('dialog').open)search()}if(e.key==='Escape'){document.querySelector('.sidebar')?.classList.remove('open');document.querySelector('.drawer-backdrop')?.classList.remove('open');if(document.querySelector('.main')?.inert){document.querySelector('.main').inert=false;document.querySelector('.mobile-nav').inert=false;document.querySelector('.mobile-menu').focus()}}if(e.key==='Tab'&&document.querySelector('.sidebar.open')){const links=[...document.querySelectorAll('.sidebar a')];if(e.shiftKey&&document.activeElement===links[0]){e.preventDefault();links.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===links.at(-1)){e.preventDefault();links[0].focus()}}const results=[...document.querySelectorAll('.command-result')];if(document.getElementById('dialog').open&&results.length&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){if(e.key==='Enter'&&document.activeElement.id!=='command-input')return;e.preventDefault();if(e.key==='Enter')results[commandIndex].click();else{commandIndex=(commandIndex+(e.key==='ArrowDown'?1:-1)+results.length)%results.length;results[commandIndex].focus()}}});
window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'overview';state='ready';userMessages=[];draft='';mobilePane='conversation';closeModal();render();window.scrollTo(0,0)});render();
</script></body></html>
