# Accepted scoped-delegation policy for systemd 255; install only during
# explicit, validated WAW enrollment. The legacy service stays unchanged.
[Service]
Delegate=cpu memory pids
DelegateSubgroup=agentbox-runtime-supervisor
ProtectControlGroups=true
ProtectProc=default
ReadWritePaths=/sys/fs/cgroup/system.slice/agentbox-runtime.service
TasksMax=256
MemoryMax=536870912
MemorySwapMax=0
CPUQuota=400%
CPUQuotaPeriodSec=100ms
